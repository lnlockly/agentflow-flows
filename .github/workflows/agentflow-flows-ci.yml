name: AgentFlow Flows CI

# Builds the AgentFlow fork of activepieces as OUR image and pushes it to
# ghcr.io/lnlockly/agentflow-flows. This is the Level-2 fork (engine-level
# control of auth + billing). The live CE pods keep running on the upstream
# image; this fork image is separate and deployed deliberately.
#
# Runs on the dedicated self-hosted ff-france runner (label `ff-france`),
# mirroring the per-repo runner pattern used by agentflow-agents /
# agentflow-mcp-server.
#
# Docs: agentflow-code-docs/subsystems/activepieces-fork-auth.mdx

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/agentflow-flows-ci.yml'
      - 'deploy/agentflow-subdomain/**'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentflow-flows

concurrency:
  group: agentflow-flows-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, ff-france]
    permissions:
      contents: read
      packages: write
    steps:
      # SHA-pinned: actions/checkout@v4 = 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve image tags
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "short=${SHA_TAG:0:12}" >> "$GITHUB_OUTPUT"

      # SHA-pinned: docker/setup-buildx-action@v3 = 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # SHA-pinned: docker/login-action@v3 = 74a5d142397b4f367a81961eba4e8cd7edddf772
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SHA-pinned: docker/build-push-action@v6 = 14487ce63c7a62a4a324b0bfb37086795e31c6c1
      - name: Build & push agentflow-flows image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "## agentflow-flows image built"
            echo "- Image: \`${IMAGE}:${{ steps.meta.outputs.sha_tag }}\`"
            echo "- Also tagged: \`${IMAGE}:latest\`"
            echo "- Runner: ff-france self-hosted"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy BOTH the app and the worker from the SAME freshly-built image, in
  # lockstep. The `activepieces` app and `activepieces-worker` exchange
  # EXECUTE_FLOW jobs over an internal RPC whose payload schema is tied to the
  # build: deploying a new app image without the matching worker (or vice
  # versa) silently breaks ALL flow execution (runs stick QUEUED, worker
  # INTERNAL_ERRORs before any sandbox). That is exactly what happened on
  # 2026-05-29 when only the app was repointed to the fork image. Applying the
  # manifest (which now carries BOTH Deployments) with the image tag rewritten
  # to this commit's SHA keeps them on the same image every time, and the final
  # assert fails the job if they ever diverge.
  # Doc: agentflow-code-docs/subsystems/activepieces-marketplace.mdx (failure modes).
  deploy:
    needs: build
    runs-on: [self-hosted, ff-france]
    permissions:
      contents: read
    steps:
      # SHA-pinned: actions/checkout@v4 = 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Apply app + worker manifest at this build's image
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MANIFEST=deploy/agentflow-subdomain/activepieces-deployment.yaml
          # Rewrite every agentflow-flows image tag to this commit's SHA, then
          # apply the whole manifest (app + worker Deployments together).
          sed -E "s|(ghcr\.io/lnlockly/agentflow-flows):[A-Za-z0-9._-]+|\1:${SHA}|g" "$MANIFEST" \
            | kubectl -n franchise-factory apply -f -
          kubectl -n franchise-factory rollout status deploy/activepieces        --timeout=8m
          kubectl -n franchise-factory rollout status deploy/activepieces-worker  --timeout=8m

      - name: Assert app and worker run the SAME image (lockstep guard)
        run: |
          set -euo pipefail
          APP=$(kubectl -n franchise-factory get deploy/activepieces        -o jsonpath='{.spec.template.spec.containers[0].image}')
          WRK=$(kubectl -n franchise-factory get deploy/activepieces-worker -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "app=$APP"
          echo "worker=$WRK"
          if [ "$APP" != "$WRK" ]; then
            echo "::error::activepieces app and worker run different images — flow execution will break (incompatible EXECUTE_FLOW job schema)."
            exit 1
          fi
          {
            echo "## agentflow-flows deployed (app + worker lockstep)"
            echo "- app + worker: \`$APP\`"
          } >> "$GITHUB_STEP_SUMMARY"
